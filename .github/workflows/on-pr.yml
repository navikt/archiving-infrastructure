name: Run end-to-end-tests on pull-requests

on:
  pull_request:

jobs:
  run-end-to-end-tests:
    permissions:
      contents: "read"
      id-token: "write"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # Not using the Maven cache built into setup-java: it derives the cache key from **/pom.xml,
      # and the sibling repositories are cloned into the workspace between restore and save, so the
      # cache ends up saved under a key that can never be restored ("maven cache is not found").
      - name: Cache Maven dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: e2e-m2-${{ runner.os }}-${{ hashFiles('system-tests/**/pom.xml') }}
          restore-keys: |
            e2e-m2-${{ runner.os }}-

      - name: 'Build the code for the components'
        uses: ./.github/checkout-and-build
        with:
          component_names: |
            soknadsmottaker@${{ github.head_ref == 'feat/grant-user-digital-access' && 'feat/grant-user-digital-access-contract' || 'main' }}
            soknadsarkiverer@${{ github.head_ref == 'feat/grant-user-digital-access' && 'feat/grant-user-digital-access' || 'main' }}
            arkiv-mock@${{ github.head_ref == 'feat/grant-user-digital-access' && 'feat/grant-user-digital-access' || 'main' }}
            innsending-api@${{ github.head_ref == 'feat/grant-user-digital-access' && 'feat/grant-user-digital-access' || 'main' }}
          prepull_test_images: true
        env:
          GITHUB_NAV_TOKEN: ${{ secrets.READER_TOKEN }}

      - name: 'Checkout skjemabygging-formio'
        uses: actions/checkout@v7
        with:
          repository: navikt/skjemabygging-formio
          ref: ${{ github.head_ref == 'feat/grant-user-digital-access' && 'feat/grant-user-digital-access' || 'main' }}
          path: skjemabygging-formio
          token: ${{ secrets.READER_TOKEN }}

      - name: 'Confirm skjemabygging-formio branch'
        run: git -C skjemabygging-formio rev-parse HEAD

      - name: 'Run the end-to-end-tests (this PR)'
        uses: ./.github/checkout-and-build
        with:
          component_name: archiving-infrastructure
          branch: ${GITHUB_HEAD_REF} # Branch of current PR
          sub_directory: system-tests
          skip_tests: false
          run_docker_build: false
          maven_arguments: >-
            -Dinnsending-api.openapi.version=${{ github.head_ref == 'feat/grant-user-digital-access' && '78f5483-dev' || '19753d3-prod' }}
