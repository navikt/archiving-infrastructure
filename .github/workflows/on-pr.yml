# TEMPORARY (issue #78): the checkout-and-build action refs below are pinned to
# @feature/json-v3-processing-events, and the soknadsarkiverer build explicitly checks out that
# branch, so CI exercises this repo's paired branch in navikt/soknadsarkiverer while the JSON v3
# processing-event/metrics migration is in flight. Revert every `@feature/json-v3-processing-events`
# ref to `@main` and drop the explicit soknadsarkiverer `branch:` override before merging to main.
name: Run end-to-end-tests on pull-requests

on:
  pull_request:

jobs:
  run-end-to-end-tests:
    permissions:
      contents: "read"
      id-token: "write"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: 'Build the code for soknadsmottaker'
        # TEMPORARY (issue #78): pinned to feature/json-v3-processing-events so CI tests the paired
        # soknadsarkiverer/soknadsmottaker branches together. Revert this ref to @main before merge.
        uses: navikt/archiving-infrastructure/.github/checkout-and-build@feature/json-v3-processing-events
        with:
          component_name: soknadsmottaker

      - name: 'Build the code for soknadsarkiverer'
        # TEMPORARY (issue #78): pinned to feature/json-v3-processing-events, and explicitly builds
        # the paired soknadsarkiverer branch of the same name. Revert both to main before merge.
        uses: navikt/archiving-infrastructure/.github/checkout-and-build@feature/json-v3-processing-events
        with:
          component_name: soknadsarkiverer
          branch: feature/json-v3-processing-events

      - name: 'Build the code for arkiv-mock'
        # TEMPORARY (issue #78): pinned to feature/json-v3-processing-events. Revert to @main before merge.
        uses: navikt/archiving-infrastructure/.github/checkout-and-build@feature/json-v3-processing-events
        with:
          component_name: arkiv-mock

      - name: 'Build the code for innsending-api'
        # TEMPORARY (issue #78): pinned to feature/json-v3-processing-events. Revert to @main before merge.
        uses: navikt/archiving-infrastructure/.github/checkout-and-build@feature/json-v3-processing-events
        with:
          component_name: innsending-api
        env:
          GITHUB_NAV_TOKEN: ${{ secrets.READER_TOKEN }}

      - name: 'Run the end-to-end-tests (this PR)'
        # TEMPORARY (issue #78): pinned to feature/json-v3-processing-events. Revert to @main before merge.
        uses: navikt/archiving-infrastructure/.github/checkout-and-build@feature/json-v3-processing-events
        with:
          component_name: archiving-infrastructure
          branch: ${GITHUB_HEAD_REF} # Branch of current PR
          sub_directory: system-tests
          skip_tests: false
          run_docker_build: false
