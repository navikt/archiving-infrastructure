# TEMPORARY (issue #78): the checkout-and-build action refs below are pinned to
# @feature/json-v3-processing-events, and the soknadsarkiverer build explicitly checks out that
# branch, so CI exercises this repo's paired branch in navikt/soknadsarkiverer while the JSON v3
# processing-event/metrics migration is in flight. Revert every `@feature/json-v3-processing-events`
# ref to `@main` and drop the explicit soknadsarkiverer `branch:` override before merging to main.
name: Run end-to-end-tests on pull-requests

on:
  pull_request:

jobs:
  run-end-to-end-tests:
    permissions:
      contents: "read"
      id-token: "write"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # Not using the Maven cache built into setup-java: it derives the cache key from **/pom.xml,
      # and the sibling repositories are cloned into the workspace between restore and save, so the
      # cache ends up saved under a key that can never be restored ("maven cache is not found").
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: e2e-m2-${{ runner.os }}-${{ hashFiles('system-tests/**/pom.xml') }}
          restore-keys: |
            e2e-m2-${{ runner.os }}-

      # Pre-pull the external images used by the testcontainers setup in the background, so that
      # the pull time overlaps with the build phase instead of landing in the test phase
      # (issue #85). Keep in sync with the image versions in EmbeddedDockerImages.kt.
      - name: 'Pre-pull external Docker images in the background'
        run: |
          (
            docker pull confluentinc/cp-kafka:8.3.1 &
            docker pull confluentinc/cp-schema-registry:8.3.1 &
            docker pull postgres:15.6 &
            docker pull gotenberg/gotenberg:8.25.1 &
            docker pull ghcr.io/navikt/mock-oauth2-server:0.5.5 &
            wait
          ) > pre-pull.log 2>&1 &
          echo "Pre-pull of external Docker images started in the background"

      - name: 'Build the code for the components'
        # TEMPORARY (issue #84): pinned to feature/faster-e2e-builds so that this PR exercises the
        # new version of the action. Revert to @feature/json-v3-processing-events before merge
        # (and to @main together with the rest of issue #78).
        uses: navikt/archiving-infrastructure/.github/checkout-and-build@feature/faster-e2e-builds
        with:
          # TEMPORARY (issue #78): soknadsarkiverer is built from the paired feature branch.
          # Drop the "@feature/json-v3-processing-events" suffix before merging to main.
          component_names: |
            soknadsmottaker
            soknadsarkiverer@feature/json-v3-processing-events
            arkiv-mock
            innsending-api
        env:
          GITHUB_NAV_TOKEN: ${{ secrets.READER_TOKEN }}

      # Ensure the background pre-pull has finished before the tests start, so the pull time does
      # not land in the test phase (issue #85). If a pull failed, testcontainers will pull the
      # image itself, so this only waits - it does not fail the build.
      - name: 'Wait for pre-pulled Docker images'
        run: |
          while pgrep -f "docker pull (confluentinc|postgres:|gotenberg|mock-oauth2)" > /dev/null; do sleep 5; done
          cat pre-pull.log

      - name: 'Run the end-to-end-tests (this PR)'
        # TEMPORARY (issue #84): see the comment above. Revert to @feature/json-v3-processing-events
        # before merge, and to @main together with the rest of issue #78.
        uses: navikt/archiving-infrastructure/.github/checkout-and-build@feature/faster-e2e-builds
        with:
          component_name: archiving-infrastructure
          branch: ${GITHUB_HEAD_REF} # Branch of current PR
          sub_directory: system-tests
          skip_tests: false
          run_docker_build: false
