name: Manually triggered build and run tests
run-name: Manual deploy to ${{ inputs.environment }} [${{ github.ref_name }}]

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'preprod'
        type: choice
        options: [none, preprod]

      innsending:
        description: 'Innsending-api branch'
        required: true
        default: 'main'
        type: string

      innsending_openapi_version:
        description: 'Innsending-api OpenAPI artifact version used by the system tests'
        required: true
        default: '19753d3-prod'
        type: string

      soknadsmottaker:
        description: 'Soknadsmottaker branch'
        required: true
        default: 'main'
        type: string

      soknadsarkiverer:
        description: 'Soknadsarkiverer branch'
        required: true
        default: 'main'
        type: string

      arkivmock:
        description: 'Arkivmock branch'
        required: true
        default: 'main'
        type: string

      skjemabygging_formio:
        description: 'Skjemabygging-formio branch'
        required: true
        default: 'main'
        type: string

jobs:
  build-and-push:
    permissions:
      contents: 'read'
      id-token: 'write'
      packages: 'read'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # See the comment in on-pr.yml for why setup-java's own Maven cache is not used
      - name: Cache Maven dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: e2e-m2-${{ runner.os }}-${{ hashFiles('system-tests/**/pom.xml') }}
          restore-keys: |
            e2e-m2-${{ runner.os }}-

      - name: 'Build the code for the components'
        uses: ./.github/checkout-and-build
        with:
          component_names: |
            soknadsmottaker@${{ inputs.soknadsmottaker }}
            soknadsarkiverer@${{ inputs.soknadsarkiverer }}
            arkiv-mock@${{ inputs.arkivmock }}
            innsending-api@${{ inputs.innsending }}
          prepull_test_images: true
        env:
          GITHUB_NAV_TOKEN: ${{ secrets.READER_TOKEN }}

      - name: 'Checkout skjemabygging-formio'
        uses: actions/checkout@v7
        with:
          repository: navikt/skjemabygging-formio
          ref: ${{ inputs.skjemabygging_formio }}
          path: skjemabygging-formio
          token: ${{ secrets.READER_TOKEN }}

      - name: 'Confirm skjemabygging-formio branch'
        run: git -C skjemabygging-formio rev-parse HEAD

      - name: 'Build and run the end-to-end-tests'
        env:
          GITHUB_NAV_TOKEN: ${{ secrets.READER_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN}}
        run: >-
          mvn install --settings system-tests/maven-settings.xml --file system-tests/pom.xml
          -Dinnsending-api.openapi.version=${{ inputs.innsending_openapi_version }}
