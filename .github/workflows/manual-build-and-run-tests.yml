name: Manually triggered build and run tests
run-name: Manual deploy to ${{ inputs.environment }} [${{ github.ref_name }}]

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'preprod'
        type: choice
        options: [none, preprod]

      innsending:
        description: 'Innsending-api branch'
        required: true
        default: 'main'
        type: string

      soknadsmottaker:
        description: 'Soknadsmottaker branch'
        required: true
        default: 'main'
        type: string

      soknadsarkiverer:
        description: 'Soknadsarkiverer branch'
        required: true
        default: 'main'
        type: string

      arkivmock:
        description: 'Arkivmock branch'
        required: true
        default: 'main'
        type: string

jobs:

  build-components:
    name: Build ${{ matrix.component }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - component: soknadsmottaker
            ref: ${{ inputs.soknadsmottaker }}

          - component: soknadsarkiverer
            ref: ${{ inputs.soknadsarkiverer }}

          - component: innsending-api
            ref: ${{ inputs.innsending }}

          - component: arkiv-mock
            ref: ${{ inputs.innsending }}

    permissions:
      contents: read
      id-token: write
      packages: read

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build component
        uses: navikt/archiving-infrastructure/.github/checkout-and-build@main
        with:
          component_name: ${{ matrix.component }}
          branch: ${{ matrix.ref }}
        env:
          GITHUB_NAV_TOKEN: ${{ secrets.READER_TOKEN }}

  e2e-tests:
    name: Run E2E tests
    runs-on: ubuntu-latest
    needs: build-components

    permissions:
      contents: read
      id-token: write
      packages: read

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts


      - name: Run end-to-end tests
        env:
          GITHUB_NAV_TOKEN: ${{ secrets.READER_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn install \
            --settings system-tests/maven-settings.xml \
            --file system-tests/pom.xml