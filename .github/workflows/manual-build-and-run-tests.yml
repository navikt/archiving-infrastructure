# TEMPORARY (issue #78): the checkout-and-build action refs below are pinned to
# @feature/json-v3-processing-events, and the `soknadsarkiverer` input default targets that branch,
# so a manual run tests this repo's paired branch in navikt/soknadsarkiverer together with the
# archiving-infrastructure branch while the JSON v3 processing-event/metrics migration is in flight.
# Revert every `@feature/json-v3-processing-events` ref and the `soknadsarkiverer` default back to
# `@main`/`'main'` before merging to main.
# TEMPORARY (issue #84): the checkout-and-build ref is pinned to @feature/faster-e2e-builds so this
# PR exercises the new version of the action. Revert to @feature/json-v3-processing-events before merge.
name: Manually triggered build and run tests
run-name: Manual deploy to ${{ inputs.environment }} [${{ github.ref_name }}]

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'preprod'
        type: choice
        options: [none, preprod]

      innsending:
        description: 'Innsending-api branch'
        required: true
        default: 'main'
        type: string

      soknadsmottaker:
        description: 'Soknadsmottaker branch'
        required: true
        default: 'main'
        type: string

      soknadsarkiverer:
        description: 'Soknadsarkiverer branch'
        required: true
        default: 'feature/json-v3-processing-events' # TEMPORARY (issue #78): revert to 'main' before merge
        type: string

      arkivmock:
        description: 'Arkivmock branch'
        required: true
        default: 'main'
        type: string

jobs:
  build-and-push:
    permissions:
      contents: 'read'
      id-token: 'write'
      packages: 'read'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # See the comment in on-pr.yml for why setup-java's own Maven cache is not used
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: e2e-m2-${{ runner.os }}-${{ hashFiles('system-tests/**/pom.xml') }}
          restore-keys: |
            e2e-m2-${{ runner.os }}-

      # Pre-pull the external images used by the testcontainers setup in the background, so that
      # the pull time overlaps with the build phase instead of landing in the test phase
      # (issue #85). Keep in sync with the image versions in EmbeddedDockerImages.kt.
      - name: 'Pre-pull external Docker images in the background'
        run: |
          (
            docker pull confluentinc/cp-kafka:8.3.1 &
            docker pull confluentinc/cp-schema-registry:8.3.1 &
            docker pull postgres:15.6 &
            docker pull gotenberg/gotenberg:8.25.1 &
            docker pull ghcr.io/navikt/mock-oauth2-server:0.5.5 &
            wait
          ) > pre-pull.log 2>&1 &
          echo "Pre-pull of external Docker images started in the background"

      - name: 'Build the code for the components'
        uses: navikt/archiving-infrastructure/.github/checkout-and-build@feature/faster-e2e-builds
        with:
          component_names: |
            soknadsmottaker@${{ inputs.soknadsmottaker }}
            soknadsarkiverer@${{ inputs.soknadsarkiverer }}
            arkiv-mock@${{ inputs.arkivmock }}
            innsending-api@${{ inputs.innsending }}
        env:
          GITHUB_NAV_TOKEN: ${{ secrets.READER_TOKEN }}

      # Ensure the background pre-pull has finished before the tests start, so the pull time does
      # not land in the test phase (issue #85). If a pull failed, testcontainers will pull the
      # image itself, so this only waits - it does not fail the build.
      - name: 'Wait for pre-pulled Docker images'
        run: |
          while pgrep -f "docker pull (confluentinc|postgres:|gotenberg|mock-oauth2)" > /dev/null; do sleep 5; done
          cat pre-pull.log

      - name: 'Build and run the end-to-end-tests'
        env:
          GITHUB_NAV_TOKEN: ${{ secrets.READER_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN}}
        run: mvn install --settings system-tests/maven-settings.xml --file system-tests/pom.xml