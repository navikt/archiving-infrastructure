# TEMPORARY (issue #78): the checkout-and-build action refs below are pinned to
# @feature/json-v3-processing-events, and the `soknadsarkiverer` input default targets that branch,
# so a manual run tests this repo's paired branch in navikt/soknadsarkiverer together with the
# archiving-infrastructure branch while the JSON v3 processing-event/metrics migration is in flight.
# Revert every `@feature/json-v3-processing-events` ref and the `soknadsarkiverer` default back to
# `@main`/`'main'` before merging to main.
name: Manually triggered build and run tests
run-name: Manual deploy to ${{ inputs.environment }} [${{ github.ref_name }}]

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'preprod'
        type: choice
        options: [none, preprod]

      innsending:
        description: 'Innsending-api branch'
        required: true
        default: 'main'
        type: string

      soknadsmottaker:
        description: 'Soknadsmottaker branch'
        required: true
        default: 'main'
        type: string

      soknadsarkiverer:
        description: 'Soknadsarkiverer branch'
        required: true
        default: 'feature/json-v3-processing-events' # TEMPORARY (issue #78): revert to 'main' before merge
        type: string

      arkivmock:
        description: 'Arkivmock branch'
        required: true
        default: 'main'
        type: string

jobs:
  build-and-push:
    permissions:
      contents: 'read'
      id-token: 'write'
      packages: 'read'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: 'Build the code for soknadsmottaker'
        uses: navikt/archiving-infrastructure/.github/checkout-and-build@feature/json-v3-processing-events
        with:
          component_name: soknadsmottaker
          branch: ${{ inputs.soknadsmottaker }}

      - name: 'Build the code for soknadsarkiverer'
        uses: navikt/archiving-infrastructure/.github/checkout-and-build@feature/json-v3-processing-events
        with:
          component_name: soknadsarkiverer
          branch: ${{ inputs.soknadsarkiverer }}

      - name: 'Build the code for arkiv-mock'
        uses: navikt/archiving-infrastructure/.github/checkout-and-build@feature/json-v3-processing-events
        with:
          component_name: arkiv-mock
          branch: ${{ inputs.arkivmock }}

      - name: 'Build the code for innsending-api'
        uses: navikt/archiving-infrastructure/.github/checkout-and-build@feature/json-v3-processing-events
        with:
          component_name: innsending-api
        env:
          GITHUB_NAV_TOKEN: ${{ secrets.READER_TOKEN }}
          branch: ${{ inputs.innsending }}

      - name: 'Build and run the end-to-end-tests'
        env:
          GITHUB_NAV_TOKEN: ${{ secrets.READER_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN}}
        run: mvn install --settings system-tests/maven-settings.xml --file system-tests/pom.xml