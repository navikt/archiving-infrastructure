name: 'Checkout and build'
description: 'Checkout, compile and docker build one or more components, in parallel'
inputs:
  component_name:
    description: 'Name of component. Use component_names to build several components in parallel.'
    required: false
    default: ""
  component_names:
    description: 'Whitespace/newline separated list of components to check out and build in parallel. Each entry may override the branch with "component@branch".'
    required: false
    default: ""
  branch:
    description: 'Branch to check out'
    required: false
    default: "main"
  sub_directory:
    description: 'Directory to go to before building'
    required: false
    default: "."
  skip_tests:
    description: 'Whether tests should be skipped during build'
    required: false
    default: "true"
  run_docker_build:
    description: 'Whether docker build should be run'
    required: false
    default: "true"
  prepull_test_images:
    description: 'Whether external images used by the system tests should be pulled in the background while the components are built. Pull failures are only warnings - the test run will pull the image on demand.'
    required: false
    default: "false"


runs:
  using: "composite"
  steps:
    - name: 'Checkout, compile and Docker Build'
      shell: bash

      run: |
        set -uo pipefail

        orig_path=$(pwd)
        branch="${{ inputs.branch }}"
        sub_directory="${{ inputs.sub_directory }}"
        skip_tests="${{ inputs.skip_tests }}"
        run_docker_build="${{ inputs.run_docker_build }}"
        prepull_test_images="${{ inputs.prepull_test_images }}"

        components="${{ inputs.component_names }} ${{ inputs.component_name }}"
        if [[ -z "$(echo $components)" ]]; then
          echo "Neither component_name nor component_names was given"
          exit 1
        fi

        prepull_images=()
        case "$prepull_test_images" in
          true)
            prepull_images=(
              "postgres:15.6"
              "gotenberg/gotenberg:8.25.1"
              "ghcr.io/navikt/mock-oauth2-server:0.5.5"
              "confluentinc/cp-kafka:7.9.1"
              "confluentinc/cp-schema-registry:7.9.1"
            )
            ;;
          false)
            ;;
          *)
            echo "prepull_test_images must be either true or false"
            exit 1
            ;;
        esac

        # The SBOM (cyclonedx) is only needed by the deploy pipelines, and takes several minutes
        # per component because it resolves the entire dependency tree. The same goes for the enforcer.
        # file-lock lets the parallel Maven processes safely share ~/.m2/repository.
        MVN_FLAGS="-B -ntp -Dcyclonedx.skip=true -DskipBomPlugin=true -Denforcer.skip=true"
        MVN_FLAGS="$MVN_FLAGS -Daether.syncContext.named.factory=file-lock -Daether.syncContext.named.nameMapper=file-gav"
        if [[ "$skip_tests" == "true" ]]; then
          # Skips compilation of the tests as well, not just the execution of them
          MVN_FLAGS="$MVN_FLAGS -Dmaven.test.skip=true"
        fi

        build_component() {
          # Accepts "component" or "component@branch"
          local component="${1%%@*}"
          local component_branch="$branch"
          if [[ "$1" == *"@"* ]]; then
            component_branch="${1#*@}"
          fi

          if [ ! -d "$component" ]; then
            git clone --depth 1 --branch "$component_branch" https://github.com/navikt/$component.git || return 1
          else
            git -C "$component" fetch --depth 1 origin "$component_branch" || return 1
            git -C "$component" checkout FETCH_HEAD || return 1
          fi

          cd "$component/$sub_directory" || return 1

          # No need to clean - the components are freshly cloned onto an ephemeral runner
          mvn install --settings maven-settings.xml $MVN_FLAGS || return 1

          if [[ "$run_docker_build" == "true" ]]; then
            APP_NAME=$(echo $(pwd) | rev | cut -f1 -d"/" | rev)
            TAG="archiving-infrastructure-${APP_NAME}:latest"
            docker build --tag $TAG . || return 1
          fi
        }

        pids=()
        names=()
        for component in $components; do
          names+=("$component")
        done

        # The external images used by the system tests are pulled in the background, so that the
        # pull time overlaps with the component builds instead of landing in the test phase
        pull_pids=()
        pull_names=()
        for image in "${prepull_images[@]}"; do
          log_file="$orig_path/pull-${image//[^a-zA-Z0-9._-]/_}.log"
          ( docker pull --quiet "$image" ) > "$log_file" 2>&1 &
          pull_pids+=("$!")
          pull_names+=("$image")
        done

        if [[ ${#names[@]} -eq 1 ]]; then
          # A single component - build it in the foreground so that the output is streamed live
          build_component "${names[0]}"
          status=$?
          echo "Building ${names[0]} ... [$([[ $status -eq 0 ]] && echo OK || echo FAILED)]"
        else
          for component in "${names[@]}"; do
            # Each component builds in its own subshell, with its own log file so that the
            # output of the parallel builds does not interleave
            ( build_component "$component" ) > "$orig_path/build-${component%%@*}.log" 2>&1 &
            pids+=("$!")
          done

          status=0
          for i in "${!pids[@]}"; do
            component="${names[$i]}"
            if wait "${pids[$i]}"; then
              result="OK"
            else
              result="FAILED"
              status=1
            fi

            echo "::group::Build of $component ... [$result]"
            cat "$orig_path/build-${component%%@*}.log"
            echo "::endgroup::"
            rm -f "$orig_path/build-${component%%@*}.log"
            echo "Building $component ... [$result]"
          done
        fi

        cd "$orig_path"

        for i in "${!pull_pids[@]}"; do
          image="${pull_names[$i]}"
          log_file="$orig_path/pull-${image//[^a-zA-Z0-9._-]/_}.log"
          if wait "${pull_pids[$i]}"; then
            echo "Pulling $image ... [OK]"
          else
            # Not fatal: Testcontainers pulls the image itself if it is missing
            echo "::warning::Pre-pull of $image failed: $(cat "$log_file")"
          fi
          rm -f "$log_file"
        done

        if [[ "$run_docker_build" == "true" ]]; then
          docker images
        fi
        exit $status
