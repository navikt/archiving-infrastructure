# The end-to-end tests share one set of containers, started once per test class, and each test uses
# its own innsendingsId. Running the test methods concurrently therefore cuts the total run time
# significantly. Test classes still run one at a time, so only one set of containers is active.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=same_thread

# Bounded parallelism: the tests are I/O bound, but each submission loads files and puts real load
# on the containers, so keep the number of concurrent tests low.
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=4
